services:
  mongodb:
    image: mongo:7.0
    container_name: ordermate_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - ordermate-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ordermate_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/ordermate
      - JWT_SECRET=ordermate_production_secret_key_987654321
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ordermate-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ordermate_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ordermate-network

networks:
  ordermate-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
